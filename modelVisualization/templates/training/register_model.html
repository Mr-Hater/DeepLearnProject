<!-- templates/training/register_model.html -->
{% load static %}

<div class="layui-card">
    <div class="layui-card-header">
        <i class="layui-icon layui-icon-add-circle"></i> 注册新模型
    </div>
    <div class="layui-card-body">
        <form class="layui-form" id="model-register-form">
            <!-- 基本信息 -->
            <div class="layui-form-item">
                <label class="layui-form-label">模型名称</label>
                <div class="layui-input-block">
                    <input type="text" name="model_name" required lay-verify="required" placeholder="请输入模型名称" autocomplete="off" class="layui-input">
                </div>
            </div>
            
            <div class="layui-form-item">
                <label class="layui-form-label">模型分类</label>
                <div class="layui-input-block">
                    <input type="text" name="category" placeholder="CNN/RNN/GNN/DNN/Transformer 或自定义分类" autocomplete="off" class="layui-input">
                </div>
            </div>
            
            <div class="layui-form-item layui-form-text">
                <label class="layui-form-label">模型描述</label>
                <div class="layui-input-block">
                    <textarea name="description" placeholder="请输入模型描述" class="layui-textarea"></textarea>
                </div>
            </div>
            
            <!-- 文件上传 -->
            <div class="layui-form-item">
                <label class="layui-form-label">模型代码</label>
                <div class="layui-input-block">
                    <button type="button" class="layui-btn" id="upload-model-code">
                        <i class="layui-icon"></i>上传模型代码文件 (.py)
                    </button>
                    <div class="layui-upload-list">
                        <p id="model-code-name"></p>
                    </div>
                    <input type="hidden" name="model_code_path" id="model-code-path">
                </div>
            </div>
            
            <div class="layui-form-item">
                <label class="layui-form-label">训练代码</label>
                <div class="layui-input-block">
                    <button type="button" class="layui-btn" id="upload-train-code">
                        <i class="layui-icon"></i>上传训练代码文件 (.py)
                    </button>
                    <div class="layui-upload-list">
                        <p id="train-code-name"></p>
                    </div>
                    <input type="hidden" name="train_code_path" id="train-code-path">
                </div>
            </div>
            
            <!-- 修改高级配置部分 -->
            <div class="layui-form-item">
                <div class="layui-collapse">
                    <div class="layui-colla-item">
                        <h2 class="layui-colla-title" style="cursor: pointer;">高级配置（可选）</h2>
                        <div class="layui-colla-content">
                            <div class="layui-form-item">
                                <label class="layui-form-label">批大小</label>
                                <div class="layui-input-block">
                                    <input type="number" name="batch_size" placeholder="默认256" autocomplete="off" class="layui-input">
                                </div>
                            </div>

                            <div class="layui-form-item">
                                <label class="layui-form-label">训练轮数</label>
                                <div class="layui-input-block">
                                    <input type="number" name="epochs" placeholder="默认100" autocomplete="off" class="layui-input">
                                </div>
                            </div>

                            <div class="layui-form-item">
                                <label class="layui-form-label">学习率</label>
                                <div class="layui-input-block">
                                    <input type="text" name="lr" placeholder="默认0.001" autocomplete="off" class="layui-input">
                                </div>
                            </div>

                            <!-- 添加更多配置项 -->
                            <div class="layui-form-item">
                                <label class="layui-form-label">数据集</label>
                                <div class="layui-input-block">
                                    <input type="text" name="dataset" placeholder="默认seed_raw" autocomplete="off" class="layui-input">
                                </div>
                            </div>

                            <div class="layui-form-item">
                                <label class="layui-form-label">数据路径</label>
                                <div class="layui-input-block">
                                    <input type="text" name="dataset_path" placeholder="默认D:/Study/EEG/LibEER/data_utils/Dataset/SEED" autocomplete="off" class="layui-input">
                                </div>
                            </div>

                            <div class="layui-form-item">
                                <label class="layui-form-label">实验设置</label>
                                <div class="layui-input-block">
                                    <input type="text" name="setting" placeholder="默认seed_sub_dependent_train_val_test_setting" autocomplete="off" class="layui-input">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 提交按钮 -->
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button class="layui-btn" lay-submit lay-filter="model-register">立即注册</button>
                    <button type="reset" class="layui-btn layui-btn-primary">重置</button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
layui.use(['form', 'upload', 'layer'], function(){
    var form = layui.form;
    var upload = layui.upload;
    var layer = layui.layer;

    var element = layui.element;

    // 初始化折叠面板
    element.render('collapse');

    // 模型代码文件上传
    var modelCodeUpload = upload.render({
        elem: '#upload-model-code',
        url: '/upload-model-code/',  // 需要创建这个URL
        accept: 'file',
        exts: 'py',
        done: function(res){
            if(res.code === 0){
                $('#model-code-name').html(res.filename);
                $('#model-code-path').val(res.filepath);
                layer.msg('模型代码上传成功');
            } else {
                layer.msg('上传失败: ' + res.msg);
            }
        },
        error: function(){
            layer.msg('上传失败');
        }
    });
    
    // 训练代码文件上传
    var trainCodeUpload = upload.render({
        elem: '#upload-train-code',
        url: '/upload-train-code/',  // 需要创建这个URL
        accept: 'file',
        exts: 'py',
        done: function(res){
            if(res.code === 0){
                $('#train-code-name').html(res.filename);
                $('#train-code-path').val(res.filepath);
                layer.msg('训练代码上传成功');
            } else {
                layer.msg('上传失败: ' + res.msg);
            }
        },
        error: function(){
            layer.msg('上传失败');
        }
    });
    
    // 表单提交
    form.on('submit(model-register)', function(data){
        var formData = data.field;
        
        // 收集配置覆盖项
        var configOverrides = {};
        if(formData.batch_size) configOverrides.batch_size = parseInt(formData.batch_size);
        if(formData.epochs) configOverrides.epochs = parseInt(formData.epochs);
        if(formData.lr) configOverrides.lr = parseFloat(formData.lr);
        
        $.ajax({
            url: '/register-model/',
            type: 'POST',
            data: {
                model_name: formData.model_name,
                category: formData.category,
                description: formData.description,
                model_code_path: formData.model_code_path,
                train_code_path: formData.train_code_path,
                config_overrides: JSON.stringify(configOverrides)
            },
            success: function(res){
                if(res.success){
                    layer.msg(res.message, {icon: 1});
                    // 清空表单
                    $('#model-register-form')[0].reset();
                    $('#model-code-name').html('');
                    $('#train-code-name').html('');

                     // 2. 立即重新加载左侧菜单（最简单的更新方式）
                    $.get('/load-left-menu/?type=useModel', function(data) {
                        $('#left-sidebar').html(data.html);
                        // 重新渲染菜单
                        layui.element.render('nav');
                        // 重新绑定事件
                        bindUseModelMenuEvents();
                    });
                } else {
                    layer.msg(res.message, {icon: 2});
                }
            },
            error: function(){
                layer.msg('请求失败', {icon: 2});
            }
        });
        
        return false;
    });
});
</script>
